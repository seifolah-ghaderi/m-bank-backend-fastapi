events {}
http {
    access_log off;
    server_tokens off;
    map $request_id $generated_uuid {
        "~^(?<u1>[0-9a-f]{8})(?<u2>[0-9a-f]{4})(?<u3>[0-9a-f]{4})(?<u4>[0-9a-f]{4})(?<u5>[0-9a-f]{12})$" $u1-$u2-$u3-$u4-$u5;
        default $request_id;
    }
    map $http_x_request_id $trace_id {
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
        default $generated_uuid;
    }
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    server {
        include /etc/nginx/crm-listen.conf;
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $api_backend http://api:8000;
        client_max_body_size 12m;
        limit_req_status 429;
        add_header X-Request-ID $trace_id always;
        proxy_hide_header X-Request-ID;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 500 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"Service unavailable","details":[],"request_id":"$trace_id"}}';
        }
        location @too_large {
            default_type application/json;
            return 413 '{"error":{"code":"file_too_large","message":"Request too large","details":[],"request_id":"$trace_id"}}';
        }
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"too_many_requests","message":"Too many requests","details":[],"request_id":"$trace_id"}}';
        }
        location = /api/v1/auth/login {
            limit_req zone=login burst=9 nodelay;
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $trace_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/v1/imports/leads {
            client_max_body_size 52m;
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $trace_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass $api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $trace_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
