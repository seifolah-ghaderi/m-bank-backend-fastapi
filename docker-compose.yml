name: bank-crm
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_runtime:${RUNTIME_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-crm}
      FORWARDED_ALLOW_IPS: ${NGINX_IP:-172.25.0.10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET}
      SMS_DIGEST_SECRET: ${SMS_DIGEST_SECRET:?Set SMS_DIGEST_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tehran}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SMS_MODE: ${SMS_MODE:-fixed}
      SMS_URL: ${SMS_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_TIMEOUT_SECONDS: ${SMS_TIMEOUT_SECONDS:-5}
      SMS_CODE_TTL_SECONDS: ${SMS_CODE_TTL_SECONDS:-300}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      SMS_RESEND_COOLDOWN_SECONDS: ${SMS_RESEND_COOLDOWN_SECONDS:-60}
      IMPORT_STORAGE_DIR: /app/var/imports
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-10}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-5000}
    volumes:
      - import_data:/app/var/imports
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx.local-listen.conf:/etc/nginx/crm-listen.conf:ro
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.25.0.10}
    depends_on: [api]
volumes:
  postgres_data:
  import_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${CRM_SUBNET:-172.25.0.0/16}
